<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handbal Progressie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/stijl.css">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#14213d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Uilenspiegel">
  <script>window.__herstel = /type=recovery/.test(location.hash);</script>
  <!-- Meegeleverde bibliotheken (geen afhankelijkheid van externe servers) -->
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/vendor/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="kop">
    <div class="kop-binnen">
      <a href="#/" class="logo"><span class="logo-badge"><img src="img/logo.png" alt=""></span><span id="ploegnaam">Handbal Progressie</span></a>
      <nav id="nav"></nav>
    </div>
  </header>
  <main id="app" class="inhoud"></main>
  <script>
    // Vangnet: start de app niet binnen 10 seconden, toon dan uitleg en een knop die oude kopieën opruimt
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app && !app.children.length) {
        app.innerHTML = '<section class="kaart smal leeg"><h2>De app laadt niet</h2><p>Controleer je internetverbinding en probeer opnieuw.</p>' +
          '<p><button class="knop" id="herstart">Opnieuw laden</button></p></section>';
        document.getElementById('herstart').onclick = function () {
          var klaar = function () { location.reload(); };
          var stappen = [];
          if (navigator.serviceWorker) stappen.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
          if (window.caches) stappen.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
          Promise.all(stappen).then(klaar, klaar);
        };
      }
    }, 10000);
  </script>
</body>
</html>
