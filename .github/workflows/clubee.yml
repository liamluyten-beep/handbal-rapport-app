name: Clubee-wedstrijden ophalen

on:
  schedule:
    - cron: '0 6 * * *'   # elke dag om 06:00 UTC
  workflow_dispatch:      # handmatig starten via de Actions-tab

permissions:
  contents: write

concurrency:
  group: clubee
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Wedstrijden ophalen
        run: node tools/clubee-ophalen.mjs
      - name: Opslaan als er iets veranderd is
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/clubee.json
            git commit -m "data: Clubee-wedstrijden bijgewerkt"
            git push
          else
            echo "Niets veranderd."
          fi
